<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Overlay engine: render.js injects fonts + gsap, then calls build(plan). Every
     component is created from plan.elements, animates on one paused GSAP timeline,
     and registers its default sound effects. Frames are rendered with a transparent
     background and composited over the source video by compose.py. -->
<style id="fontcss"></style>
<style>
:root{--p:#FF7139;--s:#9059FF;--a:#FF2A8A;--ok:#2BD67B;--dark:#14121F;--txt:#fff;--hl:#FFD23F;
  --display:Lalezar;--body:Vazirmatn;--W:1080px;--H:1920px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--W);height:var(--H);background:transparent;overflow:hidden;font-family:var(--body),Tahoma,sans-serif;color:var(--txt)}
.c{position:absolute;visibility:hidden;opacity:0}
.grad{background:linear-gradient(95deg,var(--p),var(--a) 50%,var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.ltr{direction:ltr;unicode-bidi:isolate}
.glass{background:rgba(18,16,30,.80);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 44px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.ic{display:inline-block;width:1em;height:1em;flex:none}
.ic svg{width:100%;height:100%;display:block}
.ic.img img{width:100%;height:100%;object-fit:contain;display:block}
.ic.img.fit{height:auto} .ic.img.fit img{height:auto}
.kw .ic{width:.95em;height:.95em} .note .ic{width:64px;height:64px;color:var(--hl)}

/* title */
.title{left:0;width:100%;text-align:center}
.title .kick{display:inline-flex;align-items:center;gap:12px;font:800 40px var(--body);padding:10px 28px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
.title .ln{font:400 150px/1.12 var(--display);filter:drop-shadow(0 10px 28px rgba(0,0,0,.55));white-space:nowrap}
.title .w{display:inline-block;margin:0 .14em}
.title .kick .ic{width:42px;height:42px}
.title .sub{font:800 50px var(--body);margin-top:4px;text-shadow:0 4px 18px rgba(0,0,0,.8)}

/* steps */
.steps{left:50%;display:flex;align-items:center;gap:18px;padding:12px 32px 12px 14px;border-radius:999px;white-space:nowrap;transform-origin:50% 50%;
  background:linear-gradient(95deg,#1d1830,#2a1f45);border:3px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(20,8,50,.5)}
.steps .n{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:400 50px var(--display);background:linear-gradient(135deg,var(--p),var(--a),var(--s));flex:none}
.steps .l{font:900 46px var(--body)}
.steps .l small{display:block;font:600 27px var(--body);opacity:.72}
.steps .dots{position:absolute;left:50%;top:100%;margin-top:14px;transform:translateX(-50%);display:flex;gap:10px}
.steps .dots i{width:40px;height:9px;border-radius:9px;background:rgba(40,30,70,.35)}
.steps .dots i.on{background:linear-gradient(90deg,var(--s),var(--p))}

/* keyword stickers */
.kw{white-space:nowrap;font:400 var(--sz,92px)/1.1 var(--display);display:flex;align-items:center;gap:.2em}
.kw.sticker{padding:.12em .42em .2em;border-radius:.3em;background:var(--bg,var(--p));box-shadow:0 .12em 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4)}
.kw.neon{color:#fff;text-shadow:0 0 12px var(--bg,var(--a)),0 0 32px var(--bg,var(--a)),0 0 60px var(--bg,var(--a))}
.kw.outline{color:transparent;-webkit-text-stroke:5px #fff;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.kw.gradient span.t{background:linear-gradient(95deg,var(--p),var(--a),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6))}
.kw.plain{text-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.6)}

/* note / callout / lower third */
.note{display:flex;gap:18px;align-items:flex-start;padding:22px 28px;border-radius:28px;max-width:900px}
.note .em{font-size:64px;line-height:1}
.note b{display:block;font:900 44px var(--body);color:var(--hl)}
.note p{font:700 38px/1.5 var(--body)}
.callout{display:flex;align-items:center;gap:14px;font:900 42px var(--body);padding:14px 26px;border-radius:20px;background:var(--bg,var(--p));white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.callout .ic{width:46px;height:46px}
.lt{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.lt .nm{font:400 70px var(--display);padding:6px 26px;background:var(--p);border-radius:16px 16px 16px 0}
.lt .rl{font:700 36px var(--body);padding:6px 22px;background:var(--dark);border-radius:0 0 14px 14px}

/* highlight / click / arrow */
.hl{border:6px solid var(--bg,var(--p));border-radius:16px;box-shadow:0 0 30px var(--bg,var(--p))}
.hl.circle{border-radius:50%}
.hl .lab{position:absolute;top:100%;left:50%;transform:translate(-50%,12px);font:900 36px var(--body);padding:8px 18px;border-radius:14px;background:var(--bg,var(--p));white-space:nowrap}
.rip{width:0;height:0}
.rip span{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%);border:6px solid var(--bg,var(--p));width:20px;height:20px}
.rip span.b{border-color:var(--s)}
.rip em{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);background:var(--bg,var(--p))}
svg.arw{left:0;top:0;width:var(--W);height:var(--H);overflow:visible}

/* counter, icon, compare */
.counter{text-align:center}
.counter .v{font:400 var(--sz,150px)/1 var(--display);direction:ltr}
.counter .lb{font:800 40px var(--body);margin-top:6px;text-shadow:0 3px 12px rgba(0,0,0,.8)}
.icon{font-size:var(--sz,150px);line-height:1;color:var(--bg,var(--txt));filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.st-bold .icon{color:var(--bg,var(--p));filter:drop-shadow(8px 9px 0 #000)}
.st-bold .ui{background:#fff;color:#000;border:6px solid #000;border-radius:26px;box-shadow:12px 12px 0 #000;font-weight:900}
.st-bold .ui .ck b{background:var(--p);color:#000;border:3px solid #000}
/* intro: the opening move of every edit */
.intro{left:0;top:0;width:var(--W);height:var(--H);overflow:hidden}
.intro .half{position:absolute;left:0;width:100%;height:50.5%;background:var(--intro,#000)}
.intro .iris{position:absolute;left:50%;top:42%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3000px var(--intro,#000)}
.intro .fl{position:absolute;inset:0;background:#fff}
.cmp{display:flex;gap:26px;align-items:center}
.cmp .x,.cmp .o{font:400 70px var(--display);padding:8px 30px 14px;border-radius:22px;position:relative;white-space:nowrap}
.cmp .x{background:#3a2030;color:#ff8a8a}
.cmp .x i{position:absolute;left:8%;right:8%;top:52%;height:8px;background:#ff4d4d;border-radius:8px;transform-origin:right center}
.cmp .o{background:var(--ok);color:#06210f}

/* success / cta */
.okcard{display:flex;align-items:center;gap:22px;padding:22px 40px 22px 26px;border-radius:30px;background:rgba(8,38,22,.92);border:3px solid var(--ok);box-shadow:0 20px 60px rgba(43,214,123,.4);white-space:nowrap}
.okcard .ck{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.okcard .tt{font:400 64px var(--display)}
.okcard .tt small{display:block;font:700 32px var(--body);opacity:.85}
.conf{position:absolute;width:16px;height:26px;border-radius:4px}
.cta{display:flex;gap:22px}
.cta .b{display:flex;align-items:center;gap:14px;padding:18px 30px;border-radius:24px;font:900 44px var(--body);white-space:nowrap;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.cta .b .ic{width:50px;height:50px}

/* transitions */
.tr{left:0;top:0;width:var(--W);height:var(--H);overflow:hidden}
.tr .band{position:absolute;left:-60%;top:-20%;width:220%;height:140%;background:linear-gradient(90deg,transparent,var(--p) 30%,var(--a) 50%,var(--s) 70%,transparent)}
.tr .dot{position:absolute;border-radius:50%}
.tr .slice{position:absolute;left:0;width:100%}
.tr .leak{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 40%,rgba(255,170,80,.9),rgba(255,60,120,.5) 35%,transparent 65%)}

/* captions */
.cap{left:50px;right:50px;text-align:center}
.cap .wd{display:inline-block;margin:0 .14em}
.cap.karaoke{font:900 60px/1.5 var(--body)}
.cap.karaoke .ln{display:inline-block;padding:6px 26px 12px;border-radius:22px;background:rgba(12,10,22,.74)}
.cap.karaoke .wd.on{color:var(--hl)}
.cap.pop{font:400 88px/1.25 var(--display);-webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.55)}
.cap.pop .wd.on{color:var(--hl)}
.cap.kinetic{font:900 62px/1.4 var(--body);text-shadow:0 4px 0 rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.7)}
.cap.kinetic .wd.key{font:400 96px/1 var(--display);color:var(--hl)}
.cap.minimal{font:700 50px/1.5 var(--body);text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 2px #000}
.cap.minimal .wd{background:rgba(0,0,0,.38);padding:0 .18em .06em;margin:0;border-radius:.15em;box-decoration-break:clone}
.cap.boxed{font:900 58px/1.6 var(--body)}
.cap.boxed .wd{background:var(--dark);padding:0 .25em .08em;border-radius:.2em;margin:0 .06em}
.cap.boxed .wd.on{background:var(--p)}

.progress{left:0;bottom:0;height:10px;width:var(--W);transform-origin:right center;background:linear-gradient(270deg,var(--s),var(--a),var(--p))}

/* hidden-by-default helpers some styles reveal */
.kw .ul,.hl .scr{display:none}

/* ================================================================ style: bold */
.st-bold .grad{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--p)}
.st-bold .title .ln{font-size:165px;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;filter:drop-shadow(10px 12px 0 #000)}
.st-bold .title .kick{background:var(--s);border:4px solid #000;box-shadow:6px 6px 0 #000;color:#fff}
.st-bold .title .sub{color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill;font-size:56px}
.st-bold .kw.sticker{background:var(--bg,var(--p));color:#000;border:6px solid #000;border-radius:18px;box-shadow:12px 12px 0 #000}
.st-bold .kw.plain,.st-bold .kw.neon,.st-bold .kw.gradient span.t{color:var(--p);-webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:none;background:none}
.st-bold .steps{background:var(--p);color:#000;border:5px solid #000;box-shadow:10px 10px 0 #000;border-radius:20px}
.st-bold .steps .n{background:#000;color:var(--p)}
.st-bold .steps .dots i{background:rgba(0,0,0,.25)} .st-bold .steps .dots i.on{background:#000}
.st-bold .callout,.st-bold .cta .b{border:5px solid #000;box-shadow:8px 8px 0 #000;color:#000;background:var(--p)!important}
.st-bold .cta .b .ic svg *,.st-bold .callout .ic svg *{stroke:#000;fill:none} .st-bold .cta .b .ic svg [fill="currentColor"]{fill:#000}
.st-bold .note{background:#fff;color:#000;border:5px solid #000;box-shadow:10px 10px 0 #000}
.st-bold .note b{color:var(--s)}
.st-bold .okcard{background:var(--ok);border:5px solid #000;box-shadow:10px 10px 0 #000;color:#000}
.st-bold .hl{border-width:9px;box-shadow:0 0 0 4px #000}
.st-bold .progress{height:16px;background:var(--p);border-top:4px solid #000}

/* ================================================================ style: neon */
.st-neon .glass,.st-neon .note,.st-neon .steps,.st-neon .okcard,.st-neon .callout,.st-neon .cta .b{background:rgba(4,8,22,.82)!important;border:2px solid var(--p);box-shadow:0 0 18px var(--p),inset 0 0 18px rgba(0,229,255,.25);color:#e8fdff}
.st-neon .steps .n{background:transparent;border:3px solid var(--a);box-shadow:0 0 16px var(--a);color:var(--a);font-family:var(--display)}
.st-neon .steps .l{font-family:var(--display);font-weight:700;letter-spacing:.5px}
.st-neon .steps .dots i.on{background:var(--p);box-shadow:0 0 10px var(--p)}
.st-neon .title .ln{font-weight:800;color:#fff;text-shadow:0 0 14px var(--p),0 0 40px var(--p),3px 0 0 var(--a),-3px 0 0 var(--p)}
.st-neon .grad{background:none;-webkit-background-clip:initial;color:var(--a);text-shadow:0 0 14px var(--a),0 0 40px var(--a)}
.st-neon .title .kick{background:rgba(0,229,255,.08);border-color:var(--p);box-shadow:0 0 14px var(--p)}
.st-neon .kw{font-family:var(--display);font-weight:800}
.st-neon .kw.sticker{background:rgba(4,8,22,.85);border:3px solid var(--bg,var(--a));box-shadow:0 0 22px var(--bg,var(--a));color:#fff;text-shadow:0 0 12px var(--bg,var(--a))}
.st-neon .okcard{border-color:var(--ok);box-shadow:0 0 28px var(--ok)} .st-neon .okcard .ck{background:transparent;border:3px solid var(--ok);box-shadow:0 0 18px var(--ok)}
.st-neon .hl{box-shadow:0 0 30px var(--bg,var(--p)),inset 0 0 20px var(--bg,var(--p))}
.st-neon .progress{background:var(--p);box-shadow:0 0 16px var(--p)}

/* ================================================================ style: minimal */
.st-minimal .grad{background:none;-webkit-background-clip:initial;color:var(--p)}
.st-minimal .title{padding:0 70px}
.st-minimal .title .kick{background:#fff;color:#111;border:none;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:700}
.st-minimal .title .kick .ic svg *{stroke:#111} .st-minimal .title .kick .ic svg[fill="currentColor"]{fill:#111}
.st-minimal .title .ln{color:#fff!important;font:900 120px/1.2 var(--display);color:#fff;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
.st-minimal .title .sub{font-weight:600;font-size:44px;opacity:.95}
.st-minimal .kw{font:800 76px/1.2 var(--display)}
.st-minimal .kw.plain,.st-minimal .kw.sticker{background:#fff;color:#111;padding:.15em .5em .22em;border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.22);text-shadow:none}
.st-minimal .kw .t{border-bottom:6px solid var(--bg,var(--p))}
.st-minimal .steps,.st-minimal .note,.st-minimal .callout,.st-minimal .okcard,.st-minimal .cta .b{background:#fff!important;color:#111;border:none;box-shadow:0 14px 40px rgba(0,0,0,.22)}
.st-minimal .steps .n{background:var(--p);color:#fff;font:800 42px var(--body)} .st-minimal .steps .l small{opacity:.55}
.st-minimal .steps .dots i{background:rgba(255,255,255,.5)} .st-minimal .steps .dots i.on{background:var(--p)}
.st-minimal .note b{color:var(--p)} .st-minimal .note p{font-weight:500}
.st-minimal .callout .ic svg *,.st-minimal .cta .b .ic svg *{stroke:var(--p)} .st-minimal .cta .b .ic svg[fill="currentColor"]{fill:var(--p)}
.st-minimal .okcard{border:none} .st-minimal .okcard .tt{font:800 56px var(--body)}
.st-minimal .hl{border-width:4px;box-shadow:none}
.st-minimal .progress{height:6px;background:#fff;opacity:.9}

/* ================================================================ style: doodle */
.st-doodle .grad{background:none;-webkit-background-clip:initial;color:var(--p)}
.st-doodle .title .ln{font:700 120px/1.35 var(--display);color:#fff;filter:drop-shadow(4px 5px 0 #1b1b1b)}
.st-doodle .title .kick{background:var(--a);color:#1b1b1b;border:3px solid #1b1b1b;transform:rotate(-2deg)}
.st-doodle .kw{font:700 74px/1.3 var(--display);color:#1b1b1b}
.st-doodle .kw.sticker,.st-doodle .steps,.st-doodle .note,.st-doodle .callout,.st-doodle .okcard,.st-doodle .cta .b{background:transparent!important;border:none;box-shadow:none;color:#1b1b1b;position:absolute}
.st-doodle .kw.sticker::before,.st-doodle .steps::before,.st-doodle .note::before,.st-doodle .callout::before,.st-doodle .okcard::before,.st-doodle .cta .b::before{
  content:'';position:absolute;inset:0;z-index:-1;background:#FFFDF5;border:5px solid #1b1b1b;border-radius:22px 30px 20px 34px;filter:url(#rough);box-shadow:6px 7px 0 rgba(0,0,0,.85)}
.st-doodle .kw.sticker::before{background:var(--bg,var(--a))}
.st-doodle .cta .b{position:relative}
.st-doodle .kw .ul{display:block;position:absolute;left:6%;right:6%;bottom:-.18em;height:.35em;overflow:visible}
.st-doodle .steps .n{background:var(--p);border:4px solid #1b1b1b;font-family:var(--display);filter:url(#rough)}
.st-doodle .steps .dots i{background:rgba(255,255,255,.6);border:2px solid #1b1b1b} .st-doodle .steps .dots i.on{background:var(--p)}
.st-doodle .callout .ic svg *,.st-doodle .cta .b .ic svg *{stroke:#1b1b1b} .st-doodle .cta .b .ic svg[fill="currentColor"]{fill:#1b1b1b}
.st-doodle .note b{color:var(--p)}
.st-doodle .okcard .tt{font:700 54px var(--display)} .st-doodle .okcard .ck{border:4px solid #1b1b1b}
.st-doodle .hl.scribble{border:none;box-shadow:none!important;border-radius:0}
.st-doodle .hl .scr{display:block;position:absolute;inset:-18%;width:136%;height:136%;overflow:visible}
.st-doodle .progress{height:12px;background:var(--p);filter:url(#rough)}

/* ================================================================ style: retro */
.st-retro .grad{background:none;-webkit-background-clip:initial;color:var(--hl)}
.st-retro .title .ln,.st-retro .kw,.st-retro .steps .l,.st-retro .okcard .tt{text-shadow:4px 0 0 rgba(255,46,136,.85),-4px 0 0 rgba(0,194,184,.85)}
.st-retro .title .ln{font-size:150px;font-style:italic;color:#fff}
.st-retro .title .kick{background:var(--a);border:none;border-radius:6px}
.st-retro .kw.sticker{background:var(--bg,var(--p));border-radius:6px;box-shadow:10px 10px 0 var(--s);transform-origin:center}
.st-retro .steps,.st-retro .note,.st-retro .callout,.st-retro .okcard,.st-retro .cta .b{border-radius:6px;background:var(--dark)!important;border:3px solid var(--hl);box-shadow:8px 8px 0 var(--a)}
.st-retro .steps .n{border-radius:6px;background:var(--hl);color:var(--dark)}
.st-retro .steps .dots i.on{background:var(--hl)}
.st-retro .cap.boxed .wd{background:#000;color:var(--hl);border-radius:0}
.st-retro .cap.boxed .wd.on{background:var(--a);color:#fff}
.st-retro .progress{background:repeating-linear-gradient(90deg,var(--hl) 0 18px,transparent 18px 26px)}

/* ================================================================ style: news */
.st-news .grad{background:none;-webkit-background-clip:initial;color:var(--hl)}
.st-news .title{text-align:right;padding:0 50px}
.st-news .title .kick{border-radius:0;background:var(--p);border:none;font-weight:900;letter-spacing:1px}
.st-news .title .ln{font:900 112px/1.25 var(--display);color:#fff;background:var(--s);display:inline-block;padding:0 30px 14px;margin-top:8px;filter:none}
.st-news .title .sub{display:inline-block;background:#fff;color:var(--s);padding:4px 24px;font-weight:800;text-shadow:none;margin-top:0}
.st-news .kw{font:900 66px/1.3 var(--display);color:#fff}
.st-news .kw.sticker,.st-news .callout{border-radius:0;background:var(--bg,var(--p));box-shadow:none;border-right:16px solid var(--s)}
.st-news .steps{border-radius:0;background:var(--s);border:none;border-right:14px solid var(--p);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.st-news .steps .n{border-radius:0;background:var(--p)} .st-news .steps .dots i{border-radius:0} .st-news .steps .dots i.on{background:var(--p)}
.st-news .note,.st-news .okcard,.st-news .cta .b{border-radius:0;background:#fff!important;color:var(--s);border:none;border-right:14px solid var(--p);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.st-news .cta .b .ic svg *{stroke:var(--s)} .st-news .cta .b .ic svg[fill="currentColor"]{fill:var(--s)}
.st-news .cap.karaoke .ln{border-radius:0;background:rgba(11,31,68,.92);border-bottom:6px solid var(--p)}
.st-news .progress{display:none}

/* ================================================================ fx layers */
.fx{left:0;top:0;width:var(--W);height:var(--H);pointer-events:none}
.fx.scanlines{background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px);mix-blend-mode:multiply;opacity:.55}
.fx.vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.fx.vhs svg{width:100%;height:100%;opacity:.16;mix-blend-mode:screen}
.fx.vhs .rec{position:absolute;top:60px;left:60px;font:700 44px/1 "Courier New",monospace;color:#fff;text-shadow:2px 0 #f0f,-2px 0 #0ff;direction:ltr}
.fx.vhs .rec i{display:inline-block;width:26px;height:26px;border-radius:50%;background:#ff2a2a;margin-right:14px;vertical-align:-2px}
.fx.vhs .tc{position:absolute;bottom:70px;left:60px;font:700 40px/1 "Courier New",monospace;color:#fff;text-shadow:2px 0 #f0f,-2px 0 #0ff;direction:ltr}
.fx.vhs .band{position:absolute;left:0;width:100%;height:60px;background:linear-gradient(transparent,rgba(255,255,255,.12),transparent)}

.cap.reveal{font:600 46px/1.65 var(--body);color:var(--dim);left:70px;right:70px}
.cap.reveal .wd{margin:0 .1em;transition:none}
.cap.reveal .wd.done{color:var(--txt)} .cap.reveal .wd.key{font-weight:900} .cap.reveal .wd.done.acc{color:var(--p)} .cap.reveal .wd.done.alt{color:var(--s)}
.cap.accent{font:900 66px/1.4 var(--body);color:var(--txt)}
/* over footage the dim/dark caption colours need help */
body:not(.explainer) .cap.reveal{--dim:rgba(255,255,255,.55);text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 3px #000}
body:not(.explainer) .cap.accent{color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.cap.accent .wd.key,.cap.accent .wd.acc{color:var(--p)}

/* ================================================================ style: lineglow / pictogram */
.st-lineglow .grad,.st-pictogram .grad,.st-hud .grad,.st-warmguide .grad{background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--p)}

.st-lineglow .title .ln,.st-pictogram .title .ln{font:800 96px/1.25 var(--display);filter:none}
.st-lineglow .title .kick,.st-pictogram .title .kick{background:none;border:1.5px solid var(--dim);font-weight:600}
.st-lineglow .title .sub,.st-pictogram .title .sub{font-weight:500;color:var(--dim);text-shadow:none}
.st-lineglow .title .ln{text-shadow:0 0 30px rgba(255,255,255,.35)}
.st-lineglow .kw.plain,.st-pictogram .kw.plain{font:800 var(--sz,80px)/1.2 var(--display);text-shadow:none}

.st-lineglow .note,.st-pictogram .note,.st-lineglow .callout,.st-pictogram .callout,.st-lineglow .okcard,.st-pictogram .okcard,.st-lineglow .steps,.st-pictogram .steps,.st-lineglow .cta .b,.st-pictogram .cta .b{background:#000!important;border:2px solid var(--line);box-shadow:none;color:#fff}
.st-lineglow .steps .n,.st-pictogram .steps .n,.st-lineglow .okcard .ck,.st-pictogram .okcard .ck{background:transparent;border:2px solid var(--line)}

C.arrow = (s) => {
  const [x1, y1] = s.from, [x2, y2] = s.to, cv = s.curve ?? .3;
  const mx = (x1 + x2) / 2 - (y2 - y1) * cv, my = (y1 + y2) / 2 + (x2 - x1) * cv;
  const ang = Math.atan2(y2 - my, x2 - mx), L = 34;
  const h1 = [x2 - L * Math.cos(ang - .5), y2 - L * Math.sin(ang - .5)], h2 = [x2 - L * Math.cos(ang + .5), y2 - L * Math.sin(ang + .5)];
  const col = s.color || '#FF7139';
  const d = mk('', '', s);
  d.className = 'c'; d.style.cssText = 'left:0;top:0;width:100%;height:100%';
  if (s.parent) d.dataset.parent = s.parent;
  d.innerHTML = `<svg class="arw" viewBox="0 0 ${W} ${H}" fill="none" stroke="${col}" stroke-width="${s.width || 11}" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))">
    <path class="sh" d="M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}"/><path class="hd" d="M${h1} L${x2} ${y2} L${h2}"/></svg>`;
  const sh = d.querySelector('.sh'), hd = d.querySelector('.hd'), len = sh.getTotalLength();
  gsap.set(sh, {strokeDasharray: len, strokeDashoffset: len}); gsap.set(hd, {opacity: 0});
  show(d, s.t); tl.set(d, {opacity: 1}, s.t);
  tl.to(sh, {strokeDashoffset: 0, duration: .45, ease: 'power2.inOut'}, s.t);
  tl.to(hd, {opacity: 1, duration: .1}, s.t + .4);
  hide(d, s.t + s.d, .25);
  sfx(s, [[0, 'swipe', -10]]);
};

C.counter = (s) => {

  place(d, s, W / 2, 400); show(d, s.t);
  const v = d.querySelector('.v'), o = {n: s.from ?? 0}, fmt = n => (s.prefix || '') + (s.persian === false ? n.toFixed(s.decimals || 0) : FA(n.toFixed(s.decimals || 0))) + (s.suffix || '');

};

C.success = (s) => {

// the opening of the video: the frame is revealed instead of just starting (style default: STY.intro)
//   kind: split (two halves part) · iris (circle opens on the face) · flash (white pop) · glitch · fade
C.intro = (s) => {
  const k = s.kind || STY.intro || 'split', dur = s.dur ?? .55, T = s.t ?? 0, d = mk('intro', '', s);
  if (s.color) d.style.setProperty('--intro', s.color);
  show(d, T); tl.set(d, {opacity: 1}, T);
  let fx = [[0, 'whoosh_heavy', -12]];
  if (k === 'split') {
    d.innerHTML = '<div class="half" style="top:0"></div><div class="half" style="bottom:0"></div>';
    const [a, b] = d.querySelectorAll('.half');
    tl.fromTo(a, {yPercent: 0}, {yPercent: -101, duration: dur, ease: 'power3.inOut', ...IR}, T + .05);
    tl.fromTo(b, {yPercent: 0}, {yPercent: 101, duration: dur, ease: 'power3.inOut', ...IR}, T + .05);
  } else if (k === 'iris') {
    d.innerHTML = '<div class="iris"></div>'; const e = d.firstChild;
    if (s.y) e.style.top = s.y + 'px'; if (s.x) e.style.left = s.x + 'px';
    tl.fromTo(e, {width: 10, height: 10}, {width: 2600, height: 2600, duration: dur * 1.3, ease: 'power3.in', ...IR}, T + .05);
  } else if (k === 'flash') {
    d.innerHTML = '<div class="fl"></div>';
    tl.fromTo(d.firstChild, {opacity: 1}, {opacity: 0, duration: dur, ease: 'power2.out', ...IR}, T); fx = [[0, 'whoosh_short', -12], [.02, 'impact', -16]];
  } else if (k === 'glitch') {
    d.innerHTML = '<div class="half" style="top:0;height:100%"></div>';
    for (let i = 0; i < 6; i++) tl.set(d.firstChild, {opacity: i % 2 ? .15 : .9, x: (rnd() - .5) * 80}, T + i * .05);
    tl.set(d.firstChild, {opacity: 0, x: 0}, T + .3); fx = [[0, 'glitch', -14]];
  } else {  // fade from black
    d.innerHTML = '<div class="half" style="top:0;height:100%"></div>';
    tl.fromTo(d.firstChild, {opacity: 1}, {opacity: 0, duration: dur, ...IR}, T); fx = [[0, 'whoosh_short', -14]];
  }
  tl.set(d, {visibility: 'hidden'}, T + dur * 1.4 + .1);
  sfx(s, fx);
};

let trIdx = 0;
C.transition = (s) => {
  const pool = STY.transitions || ['wipe'];
  const k = !s.kind || s.kind === 'auto' ? pool[trIdx++ % pool.length] : s.kind, dur = s.dur ?? .55, d = mk('tr', '', s);
  show(d, s.t); tl.set(d, {opacity: 1}, s.t);
  let fx;
  if (k === 'flash') { d.style.background = s.color || '#fff'; tl.fromTo(d, {opacity: .9}, {opacity: 0, duration: dur, ease: 'power2.in', ...IR}, s.t); fx = [[0, 'impact', -8]]; }
  else if (k === 'wipe') {
    d.innerHTML = '<div class="band"></div>'; const b = d.firstChild; gsap.set(b, {rotate: -18});
    tl.fromTo(b, {xPercent: 70}, {xPercent: -70, duration: dur, ease: 'power2.inOut', ...IR}, s.t); fx = [[0, 'whoosh', -6]];
  } else if (k === 'circles') {
    const cols = ['var(--p)', 'var(--a)', 'var(--s)'];
    cols.forEach((c, i) => { const e = document.createElement('div'); e.className = 'dot'; Object.assign(e.style, {background: c, left: (s.x ?? W / 2) + 'px', top: (s.y ?? H / 2) + 'px', width: '10px', height: '10px'}); d.appendChild(e);
      gsap.set(e, {xPercent: -50, yPercent: -50});
      tl.fromTo(e, {width: 10, height: 10}, {width: 2600, height: 2600, duration: dur * .55, ease: 'power3.in', ...IR}, s.t + i * .06);
      tl.to(e, {autoAlpha: 0, duration: dur * .45}, s.t + dur * .55 + i * .06); });
    fx = [[0, 'whoosh_heavy', -6]];
  } else if (k === 'glitch') {
    for (let i = 0; i < 9; i++) { const e = document.createElement('div'); e.className = 'slice'; const hgt = 30 + rnd() * 160; Object.assign(e.style, {top: rnd() * H + 'px', height: hgt + 'px', background: ['rgba(255,0,90,.55)', 'rgba(0,220,255,.5)', 'rgba(255,255,255,.35)'][i % 3], mixBlendMode: 'screen'}); d.appendChild(e);
      tl.fromTo(e, {x: (rnd() - .5) * 400, autoAlpha: 1}, {x: (rnd() - .5) * 600, autoAlpha: 0, duration: dur, ease: 'steps(5)', ...IR}, s.t); }
    fx = [[0, 'glitch', -6]];
  } else if (k === 'lightleak') {
    d.innerHTML = '<div class="leak"></div>';
    tl.fromTo(d.firstChild, {autoAlpha: 0, xPercent: -30}, {autoAlpha: 1, xPercent: 10, duration: dur * .5, ...IR}, s.t);
    tl.to(d.firstChild, {autoAlpha: 0, xPercent: 40, duration: dur * .5}, s.t + dur * .5); fx = [[0, 'whoosh_short', -8]];
  } else if (k === 'bars') {
    for (let i = 0; i < 6; i++) { const e = document.createElement('div'); e.className = 'slice'; Object.assign(e.style, {top: i * H / 6 + 'px', height: H / 6 + 1 + 'px', background: i % 2 ? 'var(--s)' : 'var(--p)'}); d.appendChild(e);
      tl.fromTo(e, {xPercent: i % 2 ? -100 : 100}, {xPercent: 0, duration: dur * .45, ease: 'power3.in', ...IR}, s.t + i * .03);
      tl.to(e, {xPercent: i % 2 ? 100 : -100, duration: dur * .45, ease: 'power3.out'}, s.t + dur * .55 + i * .03); }
    fx = [[0, 'swipe', -6], [dur * .5, 'whoosh_short', -8]];
  }
  else if (k === 'fade') { d.style.background = s.color || (EXPLAINER ? 'var(--bgc)' : '#fff'); tl.fromTo(d, {opacity: 0}, {opacity: .85, duration: dur * .45, ease: 'power1.in', ...IR}, s.t); tl.to(d, {opacity: 0, duration: dur * .55, ease: 'power1.out'}, s.t + dur * .45); fx = [[0, 'whoosh_short', -12]]; }
  else if (k === 'paper') {
    d.innerHTML = '<div style="position:absolute;inset:-6%;background:#FFFDF5;border:10px solid #1b1b1b;filter:url(#rough)"></div>';
    tl.fromTo(d.firstChild, {xPercent: 110, rotate: 6}, {xPercent: 0, rotate: 0, duration: dur * .45, ease: 'power3.in', ...IR}, s.t);
    tl.to(d.firstChild, {xPercent: -115, rotate: -6, duration: dur * .45, ease: 'power3.out'}, s.t + dur * .55); fx = [[0, 'whoosh', -6]];
  } else if (k === 'static') {
    d.innerHTML = `<svg width="100%" height="100%"><filter id="st_${s.id}"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#st_${s.id})"/></svg>`;
    const turb = d.querySelector('feTurbulence');
    tl.fromTo(d, {opacity: .9}, {opacity: 0, duration: dur, ease: 'power2.in', ...IR, onUpdate() { turb.setAttribute('seed', Math.floor(this.progress() * 30)); }}, s.t);
    fx = [[0, 'static', -6]];
  }
  else if (k === 'dissolve') {   // dip to the style background: the calm scene change of the line-art styles
    d.style.background = s.color || 'var(--bgc,#000)';
    tl.fromTo(d, {opacity: 0}, {opacity: 1, duration: dur * .5, ease: 'power1.inOut', ...IR}, s.t);
    tl.to(d, {opacity: 0, duration: dur * .5, ease: 'power1.inOut'}, s.t + dur * .5); fx = [[0, 'air', -12]];
  } else if (k === 'scan') {     // hud: a thin bright line sweeps down with a faint wash behind it
    d.innerHTML = '<div style="position:absolute;left:0;right:0;height:240px;background:linear-gradient(transparent,rgba(63,214,176,.10) 80%,var(--p) 99%,transparent)"></div>';
    tl.fromTo(d.firstChild, {top: -240}, {top: H, duration: dur, ease: 'power1.inOut', ...IR}, s.t); fx = [[0, 'soft_whoosh', -10]];
  } else if (k === 'slide') {    // warmguide: a paper-coloured sheet slides across
    d.innerHTML = '<div style="position:absolute;inset:0;background:var(--bgc,#F7F0E6);box-shadow:0 0 80px rgba(70,40,20,.25)"></div>';
    tl.fromTo(d.firstChild, {xPercent: -105}, {xPercent: 0, duration: dur * .45, ease: 'power3.in', ...IR}, s.t);
    tl.to(d.firstChild, {xPercent: 105, duration: dur * .45, ease: 'power3.out'}, s.t + dur * .55); fx = [[0, 'soft_whoosh', -8]];
  }
  tl.set(d, {visibility: 'hidden'}, s.t + dur + .4);
  sfx(s, fx);
};

/* full-frame look layers from the style preset */
C.fx = (s) => {
  const d = mk('fx ' + s.kind, '', s); show(d, 0); tl.set(d, {opacity: 1}, 0);
  if (s.kind === 'vhs') {
    d.innerHTML = `<svg><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="0"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
      <div class="rec"><i></i>REC</div><div class="tc"></div><div class="band"></div>`;
    const turb = d.querySelector('feTurbulence'), tc = d.querySelector('.tc'), rec = d.querySelector('.rec i'), band = d.querySelector('.band');
    const pad = n => String(n).padStart(2, '0');
    tl.to({}, {duration: s.duration, ease: 'none', onUpdate() {
      const t = this.time(), f = Math.floor(t * 30);
      turb.setAttribute('seed', f % 24);
      tc.textContent = `PLAY ▶  00:${pad(Math.floor(t / 60))}:${pad(Math.floor(t % 60))}:${pad(f % 30)}`;
      rec.style.opacity = Math.floor(t * 1.6) % 2 ? .25 : 1;
      band.style.top = ((t * 260) % (H + 200) - 100) + 'px';
    }}, 0);
  } else if (s.kind === 'dust') {   // slow drifting specks of light (lineglow)
    const n = s.count ?? 46;
    for (let i = 0; i < n; i++) {
      const e = document.createElement('i'), r = .8 + rnd() * 2.6;
      Object.assign(e.style, {width: r * 2 + 'px', height: r * 2 + 'px', left: rnd() * W + 'px', top: rnd() * H + 'px', opacity: .08 + rnd() * .35});
      d.appendChild(e);
      tl.to(e, {x: (rnd() - .5) * 160, y: -60 - rnd() * 220, duration: s.duration, ease: 'none'}, 0);
      tl.to(e, {opacity: .05, duration: 1.2 + rnd() * 2, yoyo: true, repeat: Math.floor(s.duration / 2.5), ease: 'sine.inOut'}, rnd() * 2);
    }
  } else if (s.kind === 'newsbar') {
    d.innerHTML = `<div class="bar"><div class="tag">${rich(s.tag || 'ترفند')}</div><div class="tk">${rich(s.text || '')}</div></div>`;
    tl.fromTo(d.querySelector('.tk'), {x: -W}, {x: W * 1.2, duration: s.duration, ease: 'none', ...IR}, 0);
  }
};

/* persistent @handle / logo watermark */
C.handle = (s) => {
  const d = mk('handle', `${s.logo ? `<img src="${s.logo}">` : ''}<span>${esc(s.text)}</span>`, s);
  const corners = {tl: [SAFE.left, SAFE.top, 'tl'], tr: [SAFE.right - 120, SAFE.top, 'tr'], bl: [SAFE.left, SAFE.bottom - 70, 'tl'], br: [SAFE.right - 120, SAFE.bottom - 70, 'tr']};
  const [x, y, a] = corners[s.corner || 'tl'];
  place(d, {x, y, anchor: a}); show(d, s.t);
  tl.fromTo(d, {autoAlpha: 0}, {autoAlpha: s.opacity ?? .85, duration: .5, ...IR}, s.t);
  if (s.d) hide(d, s.t + s.d, .3);
};

C.progress = (s) => {
  const d = mk('progress', '', s); show(d, 0); tl.set(d, {opacity: 1}, 0);
  tl.fromTo(d, {scaleX: 0}, {scaleX: 1, duration: s.duration, ease: 'none', ...IR}, 0);
};

C.captions = (s, chunks) => {
  // one element per chunk, every animation on the main timeline (free gsap tweens don't advance while
  // render.js seeks frame by frame, which left pop words invisible in full renders)
  const st = s.style || 'karaoke';
  chunks.forEach((ch, ci) => {
    const inner = ch.words.map(w => `<span class="wd${w.key ? ' key' : ''}${w.acc ? ' acc' : ''}${w.alt ? ' alt' : ''}">${esc(w.w)}</span>`).join(' ');
    const d = mk('cap ' + st, st === 'karaoke' ? `<span class="ln">${inner}</span>` : inner, {...s, id: ci ? `${s.id}_${ci}` : s.id});
    d.style.top = ch.y + 'px';
    const els = [...d.querySelectorAll('.wd')];
    show(d, ch.s);
    if (st === 'reveal') tl.fromTo(d, {autoAlpha: 0}, {autoAlpha: 1, duration: .22, ...IR}, ch.s);
    else if (st === 'accent') tl.fromTo(d, {autoAlpha: 0, y: 24}, {autoAlpha: 1, y: 0, duration: .2, ease: 'back.out(2)', ...IR}, ch.s);
    else if (st !== 'pop') tl.fromTo(d, {autoAlpha: 0, scale: .88}, {autoAlpha: 1, scale: 1, duration: .16, ease: 'back.out(2)', ...IR}, ch.s);
    else tl.set(d, {autoAlpha: 1}, ch.s);
    if (st === 'pop') els.forEach(e => gsap.set(e, {autoAlpha: 0}));
    ch.words.forEach((w, k) => {
      const at = Math.max(ch.s, w.s);
      tl.call(() => els.forEach((e, j) => { e.classList.toggle('on', j === k); e.classList.toggle('done', j <= k); }), null, at);
      if (st === 'pop') tl.fromTo(els[k], {autoAlpha: 0, scale: 1.6, y: 20}, {autoAlpha: 1, scale: 1, y: 0, duration: .12, ...IR}, at);
      if (st === 'kinetic' && w.key) tl.fromTo(els[k], {scale: 1.5}, {scale: 1, duration: .15, ...IR}, at);
    });
    tl.to(d, {autoAlpha: 0, duration: .1}, ch.e);
    tl.set(d, {visibility: 'hidden'}, ch.e + .11);
  });
};

/* ------------------------------------------------------------------ explainer components */
// Built-in pictograms for C.scene items. Coordinates are frame pixels; y of figures is the FEET line.
// Every function returns SVG markup; strokes inherit the style's line colour.
const P2 = n => +(+n).toFixed(1);
const PICTO = {
  person(o) {   // Isotype-style standing figure, ~100*s tall
    const s = o.s ?? 1, x = o.x, y = o.y, q = (a, b) => `${P2(x + a * s)} ${P2(y + b * s)}`;
    const arms = o.pose === 'raise'
      ? `L${q(-24, -104)} L${q(-17, -107)} L${q(-11, -82)}`
      : `L${q(-19, -44)} L${q(-14, -44)} L${q(-12, -66)}`;
    const armsR = o.pose === 'raise'
      ? `L${q(11, -82)} L${q(17, -107)} L${q(24, -104)}`
      : `L${q(12, -66)} L${q(14, -44)} L${q(19, -44)}`;
    const body = `M${q(-6, -78)} L${q(-16, -76)} ${arms} L${q(-11, -40)} L${q(-10, 0)} L${q(-3, 0)} L${q(0, -32)} L${q(3, 0)} L${q(10, 0)} L${q(11, -40)} ${armsR} L${q(16, -76)} L${q(6, -78)} Z`;
    const crown = o.crown ? `<path class="${o.cls || ''}" d="M${q(-9, -103)} L${q(-9, -113)} L${q(-4.5, -107)} L${q(0, -115)} L${q(4.5, -107)} L${q(9, -113)} L${q(9, -103)} Z"/>` : '';
    return `<g class="${o.cls || ''}"><circle cx="${P2(x)}" cy="${P2(y - 90 * s)}" r="${P2(9 * s)}"/><path d="${body}"/>${crown}</g>` + (o.label ? PICTO.text({x, y: y + 34 * s + 10, text: o.label, size: o.size ?? 26, cls: o.lcls}) : '');
  },
  crowd(o) {    // grid of people; hi = indices drawn bright, the rest dim
    const cols = o.cols ?? 10, rows = o.rows ?? 6, s = o.s ?? .5, gx = o.gap ?? 70 * s * 1.4, gy = o.gapY ?? 120 * s * 1.1, hi = new Set(o.hi || []);
    let out = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, px = o.x - (cols - 1) * gx / 2 + c * gx, py = o.y - (rows - 1) * gy / 2 + r * gy + 50 * s;
      out += PICTO.person({x: px, y: py, s, cls: hi.has(i) ? (o.hiCls || 'acc') : (o.cls ?? 'dim'), crown: o.crowns?.includes(i)});
    }
    return out;
  },
  pedestal(o) { // box with a number, person standing on it optional
    const w = o.w ?? 90, h = o.h ?? 120, x = o.x - w / 2, y = o.y - h;
    return `<rect class="${o.cls || ''}" x="${P2(x)}" y="${P2(y)}" width="${w}" height="${h}"/>` +
      (o.n != null ? PICTO.text({x: o.x, y: y + 34, text: o.n, size: o.size ?? 26, cls: o.ncls || 'mono'}) : '') +
      (o.person !== false ? PICTO.person({x: o.x, y, s: o.s ?? 1, cls: o.pcls || o.cls, crown: o.crown, pose: o.pose}) : '');
  },
  bars(o) {     // pictogram bar chart: one pedestal (+person) per value
    const vals = o.values, max = o.max ?? Math.max(...vals), hmax = o.hmax ?? 360, w = o.w ?? 90, gap = o.gap ?? 40;
    const tot = vals.length * w + (vals.length - 1) * gap;
    return vals.map((v, i) => PICTO.pedestal({x: o.x - tot / 2 + w / 2 + i * (w + gap), y: o.y, w, h: Math.max(8, v / max * hmax), n: o.numbers === false ? null : (o.labels?.[i] ?? FA(v)), s: o.s ?? 1,
      cls: (o.hi ?? -1) === i ? 'acc' : o.cls || '', person: o.people !== false})).join('') +
      `<line class="thin" x1="${P2(o.x - tot / 2 - 60)}" y1="${o.y}" x2="${P2(o.x + tot / 2 + 60)}" y2="${o.y}"/>`;
  },
  label(o) {    // leader line from a target point to a small text label
    const [x1, y1] = o.from, [x2, y2] = o.to;
    return `<circle class="fill ${o.cls || ''}" cx="${x1}" cy="${y1}" r="4"/><line class="thin ${o.cls || ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>` +
      PICTO.text({x: x2, y: y2 - 14, text: o.text, size: o.size ?? 26, cls: o.tcls || ''});
  },
  card(o) {     // rounded frame (choice card / panel / screen)
    const w = o.w ?? 300, h = o.h ?? 420, r = o.r ?? 22;
    return `<rect class="${o.cls || ''}" x="${P2(o.x - w / 2)}" y="${P2(o.y - h / 2)}" width="${w}" height="${h}" rx="${r}"/>` +
      (o.badge != null ? `<circle class="${o.cls || ''}" cx="${o.x}" cy="${P2(o.y - h / 2)}" r="20" style="fill:var(--bgc)"/>` + PICTO.text({x: o.x, y: o.y - h / 2 + 9, text: FA(o.badge), size: 24}) : '') +
      (o.radio ? `<circle class="${o.cls || ''}" cx="${o.x}" cy="${P2(o.y + h / 2 + 46)}" r="16"/>` + (o.selected ? `<circle class="fill" cx="${o.x}" cy="${P2(o.y + h / 2 + 46)}" r="8"/>` : '') : '');
  },
  phone(o) {
    const w = o.w ?? 300, h = o.h ?? 600, x = o.x - w / 2, y = o.y - h / 2;
    return `<rect class="${o.cls || ''}" x="${P2(x)}" y="${P2(y)}" width="${w}" height="${h}" rx="${P2(w * .14)}"/><rect class="fill ${o.cls || ''}" x="${P2(o.x - w * .14)}" y="${P2(y + 16)}" width="${P2(w * .28)}" height="14" rx="7"/>`;
  },
  globe(o) {
    const r = o.r ?? 200, x = o.x, y = o.y, c = o.cls || '';
    const blob = (dx, dy, k) => { const pts = [[0, -1], [.8, -.7], [1, .1], [.5, .9], [-.4, .8], [-1, .2], [-.7, -.6]];
      return `<path class="thin ${c}" d="M${pts.map(([a, b]) => `${P2(x + dx * r + a * k * r)} ${P2(y + dy * r + b * k * r * .8)}`).join(' L')} Z"/>`; };
    return `<circle class="${c}" cx="${x}" cy="${y}" r="${r}"/>` + (o.grid !== false ? `<ellipse class="thin dim" cx="${x}" cy="${y}" rx="${P2(r * .45)}" ry="${r}"/><line class="thin dim" x1="${x - r}" y1="${y}" x2="${x + r}" y2="${y}"/><ellipse class="thin dim" cx="${x}" cy="${y}" rx="${r}" ry="${P2(r * .35)}"/>` : '') +
      blob(-.35, -.3, .28) + blob(.35, .05, .22) + blob(-.15, .45, .18);
  },
  ring(o) { return `<circle class="${o.cls || ''}" cx="${o.x}" cy="${o.y}" r="${o.r ?? 120}"${o.w ? ` style="stroke-width:${o.w}px"` : ''}/>`; },
  eye(o) {      // the "observer" sun/eye mark
    const r = o.r ?? 40; let rays = '';
    for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; rays += `<line class="thin ${o.cls || ''}" x1="${P2(o.x + Math.cos(a) * r * 1.25)}" y1="${P2(o.y + Math.sin(a) * r * 1.25)}" x2="${P2(o.x + Math.cos(a) * r * 1.45)}" y2="${P2(o.y + Math.sin(a) * r * 1.45)}"/>`; }
    return `<circle class="${o.cls || ''}" cx="${o.x}" cy="${o.y}" r="${r}"/><circle class="${o.cls || ''}" cx="${o.x}" cy="${o.y}" r="${P2(r * .55)}"/><circle class="fill ${o.cls || ''}" cx="${P2(o.x + r * .12)}" cy="${P2(o.y - r * .08)}" r="${P2(r * .2)}"/>${rays}`;
  },
  text(o) {
    const sz = o.size ?? 30, fam = /mono/.test(o.cls || '') ? '' : o.font === 'display' ? 'font-family:var(--display);font-weight:800;' : '';
    return `<text class="${o.cls || ''}" x="${o.x}" y="${o.y}" text-anchor="${o.anchor || 'middle'}" style="font-size:${sz}px;${fam}" direction="${/[؀-ۿ]/.test(String(o.text)) ? 'rtl' : 'ltr'}">${esc(o.text)}</text>`;
  },
  line(o) { return `<line class="${o.cls || ''}" x1="${o.from[0]}" y1="${o.from[1]}" x2="${o.to[0]}" y2="${o.to[1]}"/>`; },
  arrow(o) {
    const [x1, y1] = o.from, [x2, y2] = o.to, a = Math.atan2(y2 - y1, x2 - x1), L = o.head ?? 18;
    return `<path class="${o.cls || ''}" d="M${x1} ${y1} L${x2} ${y2} M${P2(x2 - L * Math.cos(a - .5))} ${P2(y2 - L * Math.sin(a - .5))} L${x2} ${y2} L${P2(x2 - L * Math.cos(a + .5))} ${P2(y2 - L * Math.sin(a + .5))}"/>`;
  },
  crown(o) { return PICTO.person({...o, s: o.s ?? 1}).replace(/<circle[^>]*\/><path d="[^"]*"\/>/, ''); },
  beam(o) {     // soft light cone from (x,y) downwards
    const w = o.w ?? 700, h = o.h ?? 900, id = 'bm' + Math.floor(rnd() * 1e9);
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${o.opacity ?? .32}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` +
      `<path data-fill="1" style="stroke:none;fill:url(#${id})" d="M${P2(o.x - 30)} ${o.y} L${P2(o.x + 30)} ${o.y} L${P2(o.x + w / 2)} ${P2(o.y + h)} L${P2(o.x - w / 2)} ${P2(o.y + h)} Z"/>`;
  },
  glow(o) {
    const id = 'gl' + Math.floor(rnd() * 1e9);
    return `<defs><radialGradient id="${id}"><stop offset="0" stop-color="${o.color || '#fff'}" stop-opacity="${o.opacity ?? .45}"/><stop offset="1" stop-color="${o.color || '#fff'}" stop-opacity="0"/></radialGradient></defs><circle data-fill="1" style="stroke:none;fill:url(#${id})" cx="${o.x}" cy="${o.y}" r="${o.r ?? 260}"/>`;
  },
  stars(o) {    // scattered dots inside a box
    let out = ''; const [x, y, w, h] = o.rect || [0, 0, W, H];
    for (let i = 0; i < (o.n ?? 80); i++) out += `<circle class="fill ${o.cls || 'dim'}" data-fill="1" cx="${P2(x + rnd() * w)}" cy="${P2(y + rnd() * h)}" r="${P2(.8 + rnd() * (o.max ?? 2.4))}"/>`;
    return out;
  },
  grid(o) {     // floor-plan / HUD grid
    const [x, y, w, h] = o.rect, n = o.cell ?? 120; let out = '';
    for (let gx = x; gx <= x + w + .1; gx += n) out += `<line class="thin ${o.cls || 'dim'}" x1="${P2(gx)}" y1="${y}" x2="${P2(gx)}" y2="${y + h}"/>`;
    for (let gy = y; gy <= y + h + .1; gy += n) out += `<line class="thin ${o.cls || 'dim'}" x1="${x}" y1="${P2(gy)}" x2="${x + w}" y2="${P2(gy)}"/>`;
    return out;
  },
};

// C.scene: a line-art illustration that draws itself. svg = raw markup (frame coordinates, stroke-only;
// use class dim/acc/alt/fill/thin/bold/dash and data-at="sec" for a delayed reveal); items = built-in pictograms.
C.scene = (s) => {
  const d = mk('scene' + (s.glow ? ' glow' : ''), '', s);
  if (s.glow) d.style.setProperty('--gl', s.glow);
  let inner = s.svg || '';
  (s.items || []).forEach((it, i) => {
    if (!PICTO[it.shape]) throw new Error(`scene ${s.id}: unknown shape "${it.shape}" — one of ${Object.keys(PICTO).join(', ')}`);
    inner += `<g data-at="${it.at ?? 0}"${it.pulse ? ' data-pulse="1"' : ''}${it.float ? ' data-float="1"' : ''}${it.out != null ? ` data-out="${it.out}"` : ''}>${PICTO[it.shape](it)}</g>`;
  });
  d.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${inner}</svg>`;
  const svg = d.firstChild, T = s.t, draw = s.draw ?? 1, fx = [];
  show(d, T); tl.set(d, {opacity: 1}, T);
  if (s.enter === 'fade') tl.fromTo(svg, {opacity: 0}, {opacity: 1, duration: .5, ...IR}, T);
  if (s.enter === 'rise') tl.fromTo(svg, {opacity: 0, y: 60}, {opacity: 1, y: 0, duration: .6, ...IR}, T);
  if (s.enter === 'scale') tl.fromTo(svg, {opacity: 0, scale: .85, transformOrigin: '50% 50%'}, {opacity: 1, scale: 1, duration: .6, ...IR}, T);
  // group the drawable shapes by reveal time; strokes draw on, fills and text fade in
  const groups = {};
  svg.querySelectorAll('path,line,circle,rect,ellipse,polyline,polygon,text').forEach(el => {
    if (el.closest('defs')) return;
    const host = el.closest('[data-at]'), at = +(host?.dataset.at ?? el.dataset.at ?? 0);
    (groups[at] = groups[at] || []).push(el);
  });
  Object.entries(groups).forEach(([at, els]) => {
    const t0 = T + +at, stg = Math.min(.04, draw / Math.max(1, els.length) * .5);
    els.forEach((el, k) => {
      const st = getComputedStyle(el), stroked = st.stroke !== 'none' && el.tagName !== 'text' && !el.dataset.fill;
      if (stroked && s.enter !== 'fade' && typeof el.getTotalLength === 'function') {
        const L = Math.max(1, el.getTotalLength()), dashed = el.classList.contains('dash');
        if (dashed) tl.fromTo(el, {opacity: 0}, {opacity: 1, duration: draw * .6, ...IR}, t0 + k * stg);
        else { gsap.set(el, {strokeDasharray: L + 1, strokeDashoffset: L + 1}); tl.to(el, {strokeDashoffset: 0, duration: draw, ease: 'power2.inOut'}, t0 + k * stg); }
      } else gsap.set(el, {opacity: 0}), tl.fromTo(el, {opacity: 0}, {opacity: +(el.getAttribute('opacity') ?? 1), duration: Math.min(.6, draw), ...IR}, t0 + draw * .4 + k * stg);
    });
    fx.push([+at, 'draw', -13]);
  });
  svg.querySelectorAll('[data-pulse]').forEach(g => tl.to(g, {opacity: .45, duration: .6, yoyo: true, repeat: Math.max(1, Math.floor(s.d / .6) - 1), ease: 'sine.inOut'}, T + +(g.dataset.at || 0) + draw));
  svg.querySelectorAll('[data-float]').forEach(g => tl.to(g, {y: -14, duration: 1.4, yoyo: true, repeat: Math.max(1, Math.floor(s.d / 1.4)), ease: 'sine.inOut'}, T + +(g.dataset.at || 0)));
  svg.querySelectorAll('[data-out]').forEach(g => tl.to(g, {opacity: 0, duration: .4}, T + +g.dataset.out));
  // slow push inside the scene: zoom {to, cx, cy} (or [from, to])
  if (s.zoom) {
    const z = Array.isArray(s.zoom) ? {from: s.zoom[0], to: s.zoom[1]} : s.zoom;
    gsap.set(svg, {transformOrigin: `${z.cx ?? W / 2}px ${z.cy ?? H / 2}px`});
    tl.fromTo(svg, {scale: z.from ?? 1}, {scale: z.to ?? 1.08, duration: s.d, ease: z.ease || 'sine.inOut', ...IR}, T);
  }
  const ex = s.exit || 'fade';
  if (ex === 'blur') hide(d, T + s.d, .5, {filter: 'blur(14px)'});
  else if (ex === 'zoom') hide(d, T + s.d, .5, {scale: 1.25, transformOrigin: '50% 50%'});
  else if (ex !== 'none') hide(d, T + s.d, .45);
  sfx(s, fx);
};

// small monospace HUD lines (ERROR 0.000 · USERS · SAME PROMPT); classes per line: "ok:", "err:", "acc:", "hi:" prefix
C.readout = (s) => {
  const lines = (s.lines || [s.text]).map(l => { const m = String(l).match(/^(ok|err|acc|hi):\s?(.*)$/); return m ? [m[1], m[2]] : ['', l]; });
  const d = mk('readout' + (s.align === 'center' ? ' c' : ''), lines.map(([c, l]) => `<div class="${c}">${esc(l)}</div>`).join(''), s);
  if (s.size) d.style.fontSize = s.size + 'px';
  place(d, s, W / 2, 400); show(d, s.t); tl.set(d, {opacity: 1}, s.t);
  const fx = [];
  d.querySelectorAll('div').forEach((e, i) => {
    const t = s.t + i * (s.stagger ?? .35), full = e.textContent;
    if (s.typewriter !== false) { tl.call(() => e.textContent = '', null, Math.max(0, t - .001)); tl.to({n: 0}, {n: full.length, duration: Math.min(.5, full.length * .03), ease: 'none', onUpdate() { e.textContent = full.slice(0, Math.round(this.targets()[0].n)); }}, t); }
    tl.fromTo(e, {autoAlpha: 0}, {autoAlpha: 1, duration: .05, ...IR}, t);
    fx.push([t - s.t, 'tick', -14]);
  });
  hide(d, s.t + s.d, .3);
  sfx(s, fx);
};

// segmented step bar at the top (warmguide): items[{t, label}] flip the active segment
C.segbar = (s) => {
  const total = s.total ?? s.items.length;
  const d = mk('segbar', `<div class="bars">${'<i></i>'.repeat(total)}</div><div class="lb"></div>`, s);
  d.style.top = (s.y ?? SAFE.top + 10) + 'px';
  const set = i => { d.querySelectorAll('.bars i').forEach((e, k) => { e.classList.toggle('on', k === i); e.classList.toggle('done', k < i); });
    d.querySelector('.lb').innerHTML = rich(s.items[i].label ?? `${s.word ?? 'مرحله'} ${FA(i + 1)}`); };
  s.t = s.items[0].t; const fx = [];
  s.items.forEach((it, i) => {
    tl.call(() => set(i), null, Math.max(0, it.t - .001));

// shot: a real screenshot in a frame. src (png next to the plan), imgW (the png's pixel width), w (display width of
// the screen), vh (visible screen height), frame: phone|browser|none, url (browser bar), scroll[{at, y}] (image px
// from the top, eased), hi[{at, rect:[x,y,w,h] image px, d, color}], cursor[{at, x, y} image px, click], zoom {at, to, d}
C.shot = (s) => {
  const fr = s.frame || 'phone', w = s.w || 560, vh = s.vh || Math.round(w * 1.9), k = w / (s.imgW || 1075), fx = [];
  const src = String(s.src || '').replace(/^img:/, '');   // pass src as "img:<path relative to the plan>"
  const d = mk('shot ' + fr, (fr === 'browser' ? `<div class="top"><i></i><i></i><i></i><span>${esc(s.url || '')}</span></div>` : '')
    + `<div class="win" style="width:${w}px;height:${vh}px"><img src="${src}"></div>`, {...s, size: undefined, color: undefined});
  place(d, s, W / 2, 800); show(d, s.t);
  const win = d.querySelector('.win'), img = win.querySelector('img');
  const IN_MAP = {
    'rise': {y: 60, autoAlpha: 0},
    'drop': {y: -60, autoAlpha: 0},
    'slide-left': {x: 25, autoAlpha: 0, scale: 0.95},
    'slide-right': {x: -25, autoAlpha: 0, scale: 0.95},
    'zoom': {scale: 0.85, autoAlpha: 0},
    'pop': {scale: 0.88, rotate: -2, autoAlpha: 0}
  };
  const IN = IN_MAP[s.enter] || (s.enter === 'rise' ? {y: 260, autoAlpha: 0} : {scale: .8, autoAlpha: 0, rotate: -3});
  if (s.enter === 'none') tl.set(d, {autoAlpha: 1}, s.t);   // instant swap (before/after of the same screen)
  else { tl.fromTo(d, IN, {scale: 1, y: 0, rotate: 0, autoAlpha: 1, duration: .55, ease: 'back.out(1.4)', ...IR}, s.t); fx.push([0, 'whoosh_short', -8]); }
  if (s.start) tl.set(img, {y: -s.start * k}, 0);
  (s.scroll || []).forEach(sc => { tl.to(img, {y: -sc.y * k, duration: sc.dur ?? .8, ease: 'power2.inOut'}, s.t + sc.at); fx.push([sc.at, 'swipe', -12]); });

    // rings are placed in screen px relative to the current scroll (pass the scroll position they belong to as h.sy)
    const [x, y, rw, rh] = h.rect, sy = h.sy ?? 0;
    Object.assign(r.style, {left: (x * k - 10) + 'px', top: ((y - sy) * k - 10) + 'px', width: (rw * k + 20) + 'px', height: (rh * k + 20) + 'px'});

    if (h.d) tl.to(r, {autoAlpha: 0, duration: .25}, s.t + h.at + h.d);
    fx.push([h.at, 'pop', -9]);
  });

    const c = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); c.setAttribute('viewBox', '0 0 24 24'); c.setAttribute('class', 'cur');
    c.innerHTML = '<path d="M4 2 L4 19 L8.5 15 L11.5 22 L14.5 20.7 L11.6 14 L18 14 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>';
    win.appendChild(c); tl.set(c, {x: w * .7, y: vh * .75, autoAlpha: 0}, 0); tl.to(c, {autoAlpha: 1, duration: .2}, s.t + .4);

    });

  hide(d, s.t + s.d, .3, {y: -30});

C.ui = (s) => {

  else if (k === 'apps') html = `<div class="apps">${s.items.map(it => `<div class="app">${ICONS[it.icon] || isImg(it.icon || '') ? icon(it.icon) : esc(it.icon || '')}<em${it.ok ? ' class="ok"' : ''}>${it.ok ? '✓' : '✕'}</em>${it.label ? `<span>${rich(it.label)}</span>` : ''}</div>`).join('')}</div>`;

  else if (k === 'checklist') html = s.items.map(it => `<div class="ck"><b>✓</b><span>${rich(it.label ?? it)}</span></div>`).join('');
  else if (k === 'input') html = `<div class="inp"><div class="tx"></div><div class="go">${ICONS.share ? `<span class="ic">${ICONS.share}</span>` : ''}</div></div>`;
  else if (k === 'pill') html = `${icon(s.icon || 'comment')}<span>${rich(s.text || '')}</span>${s.keyword ? `<span class="k">«${rich(s.keyword)}»</span>` : ''}`;
  const d = mk('ui ' + k, html, s);

  if (s.size) d.style.fontSize = s.size + 'px';
  place(d, s, W / 2, 900); show(d, s.t);

      fx.push([at - s.t, 'typing', -16]); t += dur + (s.gap ?? .35);

// a checklist…) while the voice carries on. List the elements that make up the graphic AFTER the cutaway so they

// "blur" (compose.py blurs + darkens the real footage behind a light tint instead of covering it).
C.cutaway = (s) => {

  const bg = s.bg || 'style';
  if (bg === 'style' && !STY.bg) d.classList.add('sty');   // per-style designed backdrop (CSS .st-<style> .cutaway.sty)
  else d.style.background = bg === 'blur' ? 'rgba(0,0,0,.35)' : bg !== 'style' ? bg

  if (bg === 'style' && !STY.bg) d.innerHTML = '<i class="m1"></i><i class="m2"></i><i class="m3"></i>';
  show(d, s.t); tl.set(d, {opacity: 1}, s.t - .2);
  const k = s.enter || 'wipe', dur = .4;
  if (k === 'wipe') tl.fromTo(d, {clipPath: 'inset(0 0 0 100%)', opacity: 1}, {clipPath: 'inset(0 0 0 0%)', opacity: 1, duration: dur, ease: 'power3.inOut', ...IR}, s.t - dur * .5);
  else if (k === 'zoom') tl.fromTo(d, {autoAlpha: 0, scale: 1.15}, {autoAlpha: 1, scale: 1, duration: dur, ...IR}, s.t - dur * .5);
  else tl.fromTo(d, {autoAlpha: 0}, {autoAlpha: 1, duration: dur, ...IR}, s.t - dur * .5);

  else tl.to(d, {autoAlpha: 0, duration: dur}, e - dur * .5);
  tl.set(d, {visibility: 'hidden'}, e + dur * .5);
  sfx(s, [[-dur * .5, 'whoosh', -8]]);
};

// frame drawn around a footage window; compose.py puts the source video inside rect for [t, t+d]
C.footage = (s) => {
  const [x, y, w, h] = s.rect;
  const d = mk('footage ' + (s.frame || 'card'), '', s);
  Object.assign(d.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: (s.radius ?? 36) + 'px'});
  show(d, s.t); tl.fromTo(d, {autoAlpha: 0}, {autoAlpha: 1, duration: .3, ...IR}, s.t);
  hide(d, s.t + s.d, .3);
  sfx(s, [[0, 'whoosh_short', -12]]);
};

/* ------------------------------------------------------------------ build */
window.build = (plan) => {
  W = plan.size?.[0] || 1080; H = plan.size?.[1] || 1920;
  { const k = H / 1920, q = W / 1080, sp = plan.safe || {}; SAFE = {top: sp.top ?? 250 * k, bottom: sp.bottom ?? 1500 * k, left: sp.left ?? 60 * q, right: sp.right ?? 1020 * q}; }
  document.documentElement.style.setProperty('--W', W + 'px'); document.documentElement.style.setProperty('--H', H + 'px');
  const th = plan.theme || {};
  const map = {primary: ['--p', '#FF7139'], secondary: ['--s', '#9059FF'], accent: ['--a', '#FF2A8A'], ok: ['--ok', '#2BD67B'],
    dark: ['--dark', '#14121F'], text: ['--txt', '#fff'], highlight: ['--hl', '#FFD23F'],
    line: ['--line', '#fff'], dim: ['--dim', 'rgba(255,255,255,.35)'], card: ['--card', 'rgba(20,20,24,.92)']};
  for (const [k, [v, def]] of Object.entries(map)) document.documentElement.style.setProperty(v, th[k] || def);
  document.documentElement.style.setProperty('--display', `"${th.display || 'Lalezar'}"`);
  document.documentElement.style.setProperty('--body', `"${th.body || 'Vazirmatn'}"`);
  document.documentElement.style.setProperty('--mono', `"${th.mono || 'JetBrainsMono'}"`);
  stage = document.getElementById('world'); hudL = document.getElementById('hud');
  stage.innerHTML = ''; hudL.innerHTML = ''; gsap.set(stage, {clearProps: 'all'}); SFX = []; trIdx = 0;
  STY = plan.styleDef || {};
  // explainer mode: the whole frame is graphics. The style background lives in #bg; render.js shoots it once
  // (build/bg.png) and hides it for the transparent overlay frames, so footage windows can sit between the two.
  EXPLAINER = plan.mode === 'explainer';
  const bg = document.getElementById('bg'), bgDef = {...(STY.bg || {}), ...(plan.bg || {})};
  document.documentElement.style.setProperty('--bgc', bgDef.color || '#000');
  bg.style.background = bgDef.gradient ? `${bgDef.gradient},${bgDef.color || '#000'}` : (bgDef.color || '#000');
  if (bgDef.image) bg.style.background = `center/cover no-repeat url("${bgDef.image}")`;
  bg.style.display = EXPLAINER && plan.showBg ? 'block' : 'none';
  document.body.className = (plan.style ? 'st-' + plan.style : '') + (plan.mode === 'explainer' ? ' explainer' : '');
  let seed = 11; rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  tl = gsap.timeline({paused: true, defaults: {ease: 'power3.out'}});
  (STY.fx || []).forEach(k => C.fx({id: 'fx_' + k, type: 'fx', kind: k, duration: plan.duration, ...(plan.fxProps?.[k] || {})}));
  const CUTS = (plan.elements || []).filter(e => e.type === 'cutaway').map(e => [e.t - .25, e.t + (e.d ?? 0) + .25]);
  const markInc = e => { if (e.type !== 'cutaway' && CUTS.some(([a, b]) => e.t >= a && e.t <= b)) document.querySelectorAll(`[data-id="${e.id}"]`).forEach(n => n.classList.add('inc')); };
  (plan.elements || []).forEach((e, i) => {
    e = {...(STY.defaults?.[e.type] || {}), ...e};   // the style preset fills unset visual props
    e.id = e.id || `${e.type}_${i}`;
    if (!C[e.type]) throw new Error('unknown element type: ' + e.type);
    C[e.type](e);
    markInc(e);
  });
  if (plan.handle) C.handle({id: 'handle', type: 'handle', t: 0, ...plan.handle});
  // explainer camera: punch / zoom / shake / drift move the drawing layer (#world), never captions or the HUD
  if (EXPLAINER) for (const m of plan.camera || []) {
    const sc = m.scale ?? 1.12, d = m.d ?? 1, o = {transformOrigin: `${m.cx ?? W / 2}px ${m.cy ?? H / 2}px`};
    if (m.type === 'punch') { tl.set(stage, {scale: sc, ...o}, m.t); tl.to(stage, {scale: 1, duration: .25, ease: 'power2.out'}, m.t + d); }
    else if (m.type === 'zoom' || m.type === 'drift') { tl.to(stage, {scale: sc, x: m.dx ?? 0, y: m.dy ?? 0, duration: m.type === 'drift' ? d : .45, ease: 'sine.inOut', ...o}, m.t);
      tl.to(stage, {scale: 1, x: 0, y: 0, duration: m.back ?? .45, ease: 'sine.inOut'}, m.t + d); }
    else if (m.type === 'shake') { const a = m.amp ?? 12; for (let k = 0; k < Math.round(d / .05); k++) tl.set(stage, {x: (rnd() - .5) * 2 * a, y: (rnd() - .5) * 2 * a}, m.t + k * .05); tl.set(stage, {x: 0, y: 0}, m.t + d); }
  }
  fitSafe();
  if (plan.mascot && !(plan.elements || []).some(e => e.type === 'mascot')) C.mascot({id: 'mascot', type: 'mascot', t: 0, d: plan.duration, ...plan.mascot});
  if ((plan.progress ?? STY.progress) !== false) C.progress({id: 'progress', type: 'progress', duration: plan.duration});
  if (plan.captions && plan.captionChunks) C.captions({id: 'captions', type: 'captions', style: STY.captions, ...plan.captions}, plan.captionChunks);
  for (const x of plan.sfx || []) SFX.push({t: x.t, name: x.name, db: x.db ?? 0, src: 'manual'});

};
// keep every text element inside the Reels safe width: titles span the safe area and long lines shrink,
// anything else wider than the safe area is scaled down (transforms ignored: offsetWidth is the layout size)
window.fitSafe = fitSafe;
function fitSafe() {  // idempotent: render.js calls it again once every font face is loaded
  const SW = SAFE.right - SAFE.left, skip = ['transition', 'fx', 'progress', 'click', 'highlight', 'arrow', 'captions', 'scrim', 'shot', 'cutaway', 'panel', 'footage', 'scene', 'intro', 'mascot', 'segbar', 'success'];
  document.querySelectorAll('.title[data-id]').forEach(d => { d.style.left = SAFE.left + 'px'; d.style.width = SW + 'px'; });
  { const rail = W - 930 * W / 1080; document.querySelectorAll('.cap').forEach(c => { c.style.left = Math.max(SAFE.left, rail) + 'px'; c.style.right = rail + 'px'; }); }
  document.querySelectorAll('.title .ln').forEach(l => {
    l.style.fontSize = '';
    // measure the words themselves (offset* ignores the entrance transforms); a centered nowrap line overflows both sides
    const ws = [...l.querySelectorAll('.w')], a = Math.min(...ws.map(w => w.offsetLeft)), b = Math.max(...ws.map(w => w.offsetLeft + w.offsetWidth));
    const w = ws.length ? b - a : l.scrollWidth;
    if (w > SW) l.style.fontSize = (parseFloat(getComputedStyle(l).fontSize) * SW / w * .95).toFixed(1) + 'px';
  });

  // capped at the safe width (cards wrap), then scale down whatever still doesn't fit (nowrap rows like compare)
  const free = ['keyword', 'note', 'callout', 'compare', 'cta', 'steps', 'lowerthird', 'counter'];
  document.querySelectorAll('[data-id]').forEach(e => {
    if (skip.includes(e.dataset.type) || e.classList.contains('title')) return;
    e.style.zoom = '';
    if (free.includes(e.dataset.type)) { e.style.width = 'max-content'; e.style.maxWidth = SW + 'px'; }
    if (e.dataset.l == null) { e.dataset.l = e.style.left; e.dataset.t = e.style.top; }
    e.style.left = e.dataset.l; e.style.top = e.dataset.t;
    const w = Math.max(e.offsetWidth, e.scrollWidth);
    if (w > SW + 1) {  // CSS zoom also scales left/top, so divide them back to keep the anchor point
      const z = SW / w * .97; e.style.zoom = z.toFixed(3);
      if (e.dataset.l) e.style.left = parseFloat(e.dataset.l) / z + 'px';
      if (e.dataset.t) e.style.top = parseFloat(e.dataset.t) / z + 'px';
    }
  });
}
window.seek = t => { tl.seek(t, false); };
// visible element boxes at the current time, for the layout checker
window.boxes = () => [...document.querySelectorAll('[data-id]')].filter(e => {
  for (let n = e; n && n !== document.body; n = n.parentElement) { const cs = getComputedStyle(n); if (cs.visibility === 'hidden' || +cs.opacity < .05) return false; }
  return true;
}).map(e => {
  // arrows live in a full-frame svg: measure the drawn stroke instead
  const r = (e.dataset.type === 'arrow' ? e.querySelector('.sh') : e).getBoundingClientRect();
  return {id: e.dataset.id, type: e.dataset.type, parent: e.dataset.parent, x: r.x, y: r.y, w: r.width, h: r.height};
});
